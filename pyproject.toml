[project]
name = "asv-python"
version = "0.1.1"
description = "Reads and writes table data (CSVs) using ASCII reserved-character separators."

readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [] # proudly no dependencies

[project.urls]
Homepage = "https://github.com/tmck-code/asv-python"
Issues = "https://github.com/tmck-code/asv-python/issues"

[dependency-groups]
dev = ["mypy", "ruff"]
test = ["pytest"]

[tool.ruff]
exclude = ["bin/", ".venv/"]
line-length = 100
preview = true

[tool.ruff.lint]
fixable = ["ALL"]
dummy-variable-rgx = "^_$" # ignore variables named "_".

[tool.ruff.format]
quote-style = "preserve" # keep existing quote style (single or double)

[tool.mypy]
disallow_untyped_defs = true # no functions without type annotations
warn_return_any = true       # warn about functions that return Any
ignore_missing_imports = true # ignore imports that can't be resolved (e.g., third-party libraries without type stubs)
exclude = []
